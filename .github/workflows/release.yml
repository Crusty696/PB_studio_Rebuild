name: Release (DEACTIVATED — manual dispatch only)

# ==============================================================================
# B-720: DIESER WORKFLOW IST BEWUSST DEAKTIVIERT (kein Auto-Trigger).
#
# Grund 1 — er KANN auf einem Hosted Runner nicht bauen:
#   pb_studio.spec ruft `_resolve_packaged_binary('ffmpeg.exe')` /
#   `('ffprobe.exe')` und wirft FileNotFoundError, wenn die Dateien fehlen.
#   Gesucht wird `bin/ffmpeg.exe` bzw. `$PB_FFMPEG_EXE` / `$PB_FFPROBE_EXE`.
#   `bin/` steht in .gitignore (Zeile 101) -> ein frischer Checkout auf
#   github-hosted Windows hat die Binaries nicht, und dieser Workflow hat
#   keine Bezugsquelle dafuer. Der Build wuerde immer in PyInstaller sterben.
#
# Grund 2 — User-Anweisung 2026-07-17: keine Release-/Installer-Builds, bis
#   alles andere fertig ist. Nur Dev-Start aus dem Repo.
#
# Deshalb:
#   * Der `push`-Tag-Trigger ist entfernt. Ein `git push --tags` startet
#     hier nichts mehr.
#   * `workflow_dispatch` bleibt als bewusster manueller Notausgang, wird
#     aber vom Preflight-Step unten hart abgebrochen, solange die
#     FFmpeg-Binaries fehlen (statt nach ~20 Minuten in PyInstaller).
#
# Grund 3 (behoben, damit hier keine falsche Runtime dokumentiert bleibt):
#   Der Build lief vorher auf Python 3.11 + torch cu124 + `poetry install`.
#   Zielruntime ist Python 3.10 + torch 1.12.1+cu113 (kanonisch:
#   environment.yml -> requirements-py310-cu113.txt), GPU-Hartregel D-040
#   (GTX 1060 / CUDA 11.3). Zusaetzlich ist poetry.lock aelter als
#   pyproject.toml und kennt dort gelistete Pakete nicht -> `poetry install`
#   waere ohnehin abgebrochen. Der Install-Pfad ist jetzt derselbe wie in
#   ci.yml: `pip install -r requirements-py310-cu113.txt`.
#
# Reaktivierung: erst wenn (a) der User Release-Builds wieder freigibt UND
# (b) dieser Workflow eine legale FFmpeg-Quelle hat (Self-hosted Runner mit
# bin/, Secret-basierter Download oder committete Binaries).
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.5.0)"
        required: true
        default: "0.5.0"

jobs:
  # ──────────────────────────────────────────────
  # 1. Build (PyInstaller, Windows)
  # ──────────────────────────────────────────────
  build:
    name: Build (PyInstaller)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight — packaged FFmpeg binaries present?
        # B-720: harter Abbruch statt Blindflug. pb_studio.spec:33-58 verlangt
        # bin/ffmpeg.exe + bin/ffprobe.exe (oder PB_FFMPEG_EXE/PB_FFPROBE_EXE).
        # bin/ ist gitignored -> auf einem Hosted Runner immer leer.
        shell: bash
        run: |
          missing=0
          for name in ffmpeg.exe ffprobe.exe; do
            if [ ! -f "bin/$name" ]; then
              echo "MISSING: bin/$name"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Release build is deactivated (B-720): bin/ffmpeg.exe / bin/ffprobe.exe are gitignored and this workflow has no source for them. pb_studio.spec would raise FileNotFoundError. See the comment block at the top of this file."
            exit 1
          fi

      - name: Set up Python 3.10 (target runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install target runtime dependencies
        # B-720: identisch zu ci.yml. requirements-py310-cu113.txt zieht
        # torch==1.12.1+cu113 ueber --extra-index-url (GPU-Hartregel D-040).
        # Kein poetry: poetry.lock ist gegenueber pyproject.toml veraltet.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-py310-cu113.txt
          python -m pip install ./vendor/beat_this --no-deps
          python -m pip install pyinstaller

      - name: Update version in pyproject.toml
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

      - name: Build with PyInstaller
        run: pyinstaller pb_studio.spec

      - name: Verify dist output
        shell: bash
        run: |
          ls dist/
          test -d dist/pb_studio || (echo "ERROR: dist/pb_studio/ not found" && exit 1)

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pb-studio-dist-${{ steps.version.outputs.version }}
          path: dist/pb_studio/
          retention-days: 3

  # ──────────────────────────────────────────────
  # 2. Package (NSIS installer)
  # ──────────────────────────────────────────────
  package:
    name: Package (NSIS installer)
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: pb-studio-dist-${{ needs.build.outputs.version }}
          path: dist/pb_studio/

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress

      - name: Update version in NSIS script
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          sed -i "s/!define APP_VERSION .*/!define APP_VERSION \"$VERSION\"/" installer/pb_studio.nsi

      - name: Build installer
        shell: cmd
        run: |
          makensis installer\pb_studio.nsi

      - name: Verify installer
        shell: bash
        run: |
          ls dist/
          test -f "dist/pb_studio_setup_v${{ needs.build.outputs.version }}.exe" || \
            (echo "ERROR: Installer not found" && exit 1)

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pb-studio-installer-${{ needs.build.outputs.version }}
          path: dist/pb_studio_setup_v${{ needs.build.outputs.version }}.exe
          retention-days: 30

  # ──────────────────────────────────────────────
  # 3. GitHub Release
  # ──────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, package]
    # B-720: Ohne Tag-Trigger ist diese Bedingung bei workflow_dispatch nie
    # wahr — es wird also auch manuell kein GitHub-Release veroeffentlicht.
    # Das ist beabsichtigt (Workflow deaktiviert). Beim Reaktivieren muss der
    # Tag-Trigger oben wieder rein, sonst bleibt dieser Job tot.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: pb-studio-installer-${{ needs.build.outputs.version }}
          path: release/

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --oneline --no-decorate)
          else
            COMMITS=$(git log --oneline --no-decorate | head -20)
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PB Studio v${{ needs.build.outputs.version }}
          body: |
            ## PB Studio v${{ needs.build.outputs.version }}

            ### Installation
            Download `pb_studio_setup_v${{ needs.build.outputs.version }}.exe` and run the installer.

            **Requirements:**
            - Windows 10/11 (64-bit)
            - NVIDIA GPU recommended (falls back to CPU)
            - ~2 GB disk space (AI models downloaded on first use)

            ### Changes
            ${{ steps.changelog.outputs.changelog }}
          files: |
            release/pb_studio_setup_v${{ needs.build.outputs.version }}.exe
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
